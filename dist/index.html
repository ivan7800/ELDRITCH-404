<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111b24">
<title>ELDRITCH-404</title>
<link rel="icon" href="./assets/icon.png">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main id="app">
  <canvas id="world" aria-hidden="true" hidden></canvas>
  <div id="hud" hidden></div>
  <div id="touch-controls" hidden>
    <div id="touch-stick" aria-hidden="true"></div>
    <div class="touch-actions">
      <button id="touch-pause" data-do="pause">Pausa</button>
      <button id="touch-interact">Ritual</button>
      <button id="touch-dash">Esquiva</button>
    </div>
  </div>
  <div id="overlay"></div>
  <div id="notice" role="status" aria-live="polite"></div>
</main>
<script type="module" src="./src/app.mjs"></script>
</body>
</html>
