.hero::after{content:"";position:absolute;inset:20px;pointer-events:none;border:1px solid #a2c2b037}
.title-copy{position:relative;z-index:1;max-width:600px;width:100%;padding:18px 0}
.mark{width:59px;height:59px;display:block;margin-bottom:18px}
.eyebrow,.status,.tag,.build,.clue{font:700 .72rem/1.4 var(--mono);letter-spacing:.17em;text-transform:uppercase;color:var(--mint)}
.eyebrow{display:flex;gap:11px;align-items:center}
.eyebrow:before{content:"";display:block;width:28px;height:1px;background:var(--mint)}
h1,h2,h3,p{margin:0}
h1{font:700 clamp(55px,9.2vw,147px)/.84 var(--serif);letter-spacing:-.077em;text-shadow:0 7px 32px #080e16;margin:18px 0}
h1 span{display:block;color:var(--gold);font-size:.54em;letter-spacing:.05em;margin-top:.17em}
.lede{font:clamp(17px,2.2vw,24px)/1.38 var(--serif);max-width:385px;color:#dddccc;margin:25px 0}
.home-actions{display:grid;gap:9px;max-width:300px}
.home-actions button{display:flex;justify-content:space-between;align-items:center}
.home-actions b{color:inherit;font:700 11px var(--mono);letter-spacing:.08em}
.hero-footer{margin-top:25px;color:#c1cdc7;font:12px/1.45 var(--mono)}
.stage-name{position:absolute;right:clamp(40px,5vw,110px);bottom:44px;color:#c9dece;text-align:right;text-shadow:0 2px 7px #0a1115;font:700 .8rem var(--mono);letter-spacing:.13em}
.stage-name span{display:block;color:#96b5a9;font-size:.62rem;margin-top:6px}
.panel{width:min(640px,calc(100% - 32px));max-height:calc(100% - 32px);overflow:auto;background:linear-gradient(150deg,#1b2d34,#111e27 65%);border:1px solid #536d67;box-shadow:0 0 0 5px #09151bcc,0 20px 80px #000a;padding:clamp(20px,4vw,36px);scrollbar-color:#567971 #13242a}
.panel.wide{width:min(900px,calc(100% - 32px))}
.panel h2{font:700 clamp(30px,5vw,54px)/1 var(--serif);margin:8px 0 13px;letter-spacing:-.045em}
.panel p,.entry{color:var(--muted);line-height:1.48;margin:8px 0}
.panel .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.panel button{border-radius:2px}
#hud{position:absolute;inset:0;pointer-events:none}
.hud-top{display:grid;grid-template-columns:minmax(155px,255px) 1fr minmax(125px,255px);align-items:start;gap:12px;padding:19px 22px}
.hp-box,.run-box,.tool-box,.arsenal,.interaction,.boss-bar{background:#111f27e9;border:1px solid #526969;border-radius:2px;box-shadow:0 5px 25px #070d15b7}
.hp-box,.run-box,.tool-box{padding:9px 12px}
.hud-row{display:flex;justify-content:space-between;gap:8px;align-items:center;font:700 .72rem var(--mono);color:var(--bone);letter-spacing:.04em}
.hud-row+ .hud-row{margin-top:5px}
meter{display:block;width:100%;height:8px;margin:4px 0;appearance:none;background:#283639;border:0}
meter::-webkit-meter-bar{background:#283639;border:0;border-radius:0;height:7px}
meter::-webkit-meter-optimum-value{background:var(--mint)}
meter::-moz-meter-bar{background:var(--mint)}
#hp::-webkit-meter-optimum-value,#boss-meter::-webkit-meter-optimum-value{background:var(--red)}
#sanity::-webkit-meter-optimum-value{background:#b799cd}
.run-box{justify-self:center;text-align:center;min-width:140px}
#clock{display:block;font:700 1.95rem/.93 var(--serif);font-variant-numeric:tabular-nums;letter-spacing:.04em;color:var(--gold);margin:5px 0}
.tool-box{justify-self:end;min-width:125px}
.arsenal{position:absolute;bottom:17px;left:19px;padding:7px 10px;display:flex;gap:8px;align-items:center}
.arm{display:grid;place-items:center;min-width:35px;padding:4px;border:1px solid currentColor;font:700 .66rem var(--mono)}
.arm svg,.loot svg{width:23px;height:23px;display:block;margin-bottom:3px}
.interaction{position:absolute;bottom:75px;left:50%;transform:translateX(-50%);width:max-content;max-width:90%;padding:8px 13px;color:var(--bone)}
.interaction button{pointer-events:auto;min-height:34px;padding:5px 8px}
.boss-bar{position:absolute;bottom:16px;width:min(380px,40%);left:50%;transform:translateX(-50%);padding:7px 10px;text-align:center;color:var(--red);font:700 .68rem var(--mono)}
#notice{position:absolute;right:21px;bottom:17px;max-width:min(440px,85vw);padding:8px 12px;color:var(--gold);background:#15232bea;border:1px solid var(--line);z-index:3;pointer-events:none}
#notice:empty{display:none}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px;margin-top:19px}
.loot{min-height:154px;padding:13px;display:flex;flex-direction:column;gap:8px}
.loot strong{font:700 1.2rem/1.05 var(--serif)}
.loot small{color:#ced8d3;line-height:1.32;font-size:.82rem}
.loot .tag{color:var(--gold);letter-spacing:.08em;margin-top:auto}
.setting{display:grid;grid-template-columns:1fr minmax(115px,45%);align-items:center;gap:10px;border-top:1px solid var(--line);padding:10px 0;color:var(--bone)}
.setting input[type=checkbox]{justify-self:end;width:18px;height:18px}
select{padding:6px}
input[type=range]{accent-color:var(--mint);width:100%}
kbd{font:700 .75rem var(--mono);display:inline-block;border:1px solid #607d72;padding:4px 7px;color:var(--mint);border-radius:2px}
.stats{display:flex;gap:17px;flex-wrap:wrap;margin:15px 0}
.stats div{padding:9px 13px;border-left:1px solid var(--mint)}
.stats b{display:block;font:700 1.55rem var(--serif);margin-top:2px}
#app.large .panel{font-size:1.15rem}
#app.large .hud-row,#app.large .eyebrow,#app.large .tag{font-size:.83rem}
.panel.wide{width:min(960px,calc(100% - 28px))}
.panel h3{font-size:1rem;margin:18px 0 8px;color:var(--mint)}
.selection{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0}
.selection button{min-height:34px;padding:6px 10px}
.selection button:disabled,.archive-grid button:disabled{opacity:.48;cursor:default}
.archive-grid,.codex-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.archive-grid>div,.codex-list>li{background:#14262b;border:1px solid var(--line);padding:10px 12px}
.archive-grid>div h3{margin-top:0}
.codex-list{list-style:none;padding:0}
#app.contrast{--mint:#aaffda;--gold:#ffe3a0;--bone:#fff;--line:#82a5aa}
#app.contrast .hud-top,#app.contrast .boss-bar{font-weight:700}
#touch-controls{display:none}
@media(pointer:coarse){
  #touch-controls{display:flex;position:absolute;z-index:2;inset:auto 12px 14px;justify-content:space-between;align-items:end;pointer-events:none}
  #touch-stick{width:105px;height:105px;border:2px solid #a2ceb5a0;border-radius:50%;background:#14262b87;pointer-events:auto;touch-action:none}
  #touch-stick::after{content:'';display:block;width:28px;height:28px;margin:36px auto;border-radius:50%;background:#a2ceb598}
  .touch-actions{display:grid;gap:5px;pointer-events:auto;touch-action:none}
  .touch-actions button{min-width:75px;min-height:42px;background:#172c32ed}
  .arsenal,.boss-bar{bottom:130px}
  .interaction{bottom:165px}
}
@media(max-width:680px){.hero{background-position:56% center}.hero::after{inset:10px}.stage-name{display:none}.hud-top{padding:8px;gap:6px;grid-template-columns:minmax(82px,1fr) auto minmax(62px,1fr)}.hp-box,.tool-box,.run-box{min-width:0;padding:5px}.run-box .status{font-size:.5rem;letter-spacing:0}.hud-row{font-size:.58rem}.hud-row span{overflow:hidden;text-overflow:ellipsis}.cards{grid-template-columns:1fr;gap:7px}.loot{min-height:auto;gap:5px}.loot svg{display:none}.boss-bar{width:48%;left:auto;right:8px;transform:none}.arsenal{left:8px;gap:3px;padding:3px}.arm{min-width:24px}.arm svg{width:15px;height:15px}}

/* Ink and bone carry the interface. Brass marks objectives; red marks threats. */
.hero::after { border-color: #e1bb8860; inset: clamp(9px,2vw,24px); }
.title-copy { max-width: 640px; }
.hero-footer { margin-top: 18px; color: var(--gold); }
.home-actions { max-width: 345px; }
.home-actions button { background: #132129e8; }
.home-actions button.primary { background: var(--mint); }
.mode-list { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px; margin:18px 0; }
.mode-list button { width:100%; display:grid; gap:4px; background:#14262b; }
.mode-list button:hover,.mode-list button:focus-visible { background:#263e40; }
.mode-list strong { font:700 1.16rem/1.13 var(--serif); }
.mode-list small { color:var(--muted); line-height:1.35; }
.chapter-list { padding:0; list-style:none; }
.chapter-list li { min-width:0; }
.chapter-list button:disabled { opacity:.63; cursor:default; }
.brief-overview { display:grid; grid-template-columns:minmax(0,1fr) minmax(160px,32%); align-items:center; gap:16px; }
.brief-overview img { width:100%; height:auto; aspect-ratio:16 / 9; object-fit:cover; image-rendering:pixelated; border:1px solid var(--line); }
.brief-overview .brief-objective { color:var(--bone); font-weight:700; }
.brief-overview strong { color:var(--gold); font-variant-numeric:tabular-nums; }
.boss-warning { display:block; margin:.3em 0; color:var(--bone); font-weight:bold; }
.boss-warning::before { content:"! "; color:var(--red); }
#hp::-moz-meter-bar,#boss-meter::-moz-meter-bar { background:var(--red); }
#sanity::-moz-meter-bar { background:#b799cd; }
:focus-visible { outline-offset:2px; }
.panel { overscroll-behavior:contain; }
@media(max-width:560px) {
  .hero { background-position:61% center; align-items:safe center; }
  .mode-list,.brief-overview { grid-template-columns:1fr; gap:7px; }
  .brief-overview img { max-height:105px; }
  .run-box .status { font-size:.59rem; }
  .touch-actions button { min-height:44px; }
}
@media(max-height:570px) {
  .hero { align-items:safe center; padding-block:13px; }
  .mark { display:none; }
  .lede { margin-block:14px; }
}
</style>
</head>

<main id="app">
  <canvas id="world" aria-hidden="true" hidden></canvas>

    <div id="touch-stick" aria-hidden="true"></div>
    <div class="touch-actions">
      <button id="touch-pause" data-do="pause">Pausa</button>
      <button id="touch-interact">Ritual</button>
      <button id="touch-dash">Esquiva</button>
    </div>
  </div>
  <div id="overlay"></div>
  <div id="notice" role="status" aria-live="polite"></div>
</main>

function seeded(seed) {

class SpatialGrid {
  constructor(size = 64) {
    this.size = size;

  }
  reset(entities) {
    for (const bucket of this.buckets.values()) {
      bucket.length = 0;
      this.reusable.push(bucket);
    }
    this.buckets.clear();
    for (const entity of entities) {
      if (entity.hp <= 0) continue;
      const key = this.key(Math.floor(entity.x / this.size), Math.floor(entity.y / this.size));
      if (!this.buckets.has(key)) this.buckets.set(key, this.reusable.pop() ?? []);
      this.buckets.get(key).push(entity);
    }
  }
  key(x, y) { return x + 4096 * y; }
  *near(x, y, r) {
    for (let row = Math.floor((y-r)/this.size); row <= Math.floor((y+r)/this.size); row++) {
      for (let col = Math.floor((x-r)/this.size); col <= Math.floor((x+r)/this.size); col++) {

        if (bucket) yield* bucket;
      }
    }
  }
}

    this.live.push(item);
    return item;
  }
  remove(index) {
    const item = this.live[index];
    this.live[index] = this.live[this.live.length - 1];

  }

function performanceReadout() {
  if (samples.length < 10) return '';
  const sorted = [...samples].sort((a,b)=>a-b);
  const p95 = sorted[Math.ceil(sorted.length*.95)-1];
  const fps = 1000*samples.length/samples.reduce((sum,value)=>sum+value,0);
  return '<p class="tag">'+tr('Últimos fotogramas','Recent frames')+' · '+Math.round(fps)+' FPS · p95 '+p95.toFixed(1)+' ms</p>';
}

function hasSuspend() {
  try { return !!storage.getItem(suspendedKey); } catch { return false; }

function displayCampaign() {
  const progress = profile.progress;
  const choice = id => progress.choices[id] ? ' · '+loc(decisions[progress.choices[id]]) : '';
  const chapters = stages.map(stage => {
    const cleared = progress.clears.includes(stage.id);
    const unlocked = stageUnlocked(progress,stage.id);
    const status = progress.pending?.stage===stage.id ? tr('Decisión pendiente','Decision pending') :
      cleared ? tr('Completado','Cleared')+choice(stage.id) : unlocked ? tr('Disponible','Available') : tr('Bloqueado','Locked');
    return '<li><button data-do="open-chapter" data-value="'+stage.id+'"'+(!unlocked||progress.pending?' disabled':'')+
      '><strong>'+(stage.id+1)+' · '+loc(stage.name)+'</strong><small>'+status+'</small></button></li>';
  }).join('');
  overlay.innerHTML = panel(tr('Bitácora','Voyage log'),tr('Campaña','Campaign'),
    (progress.pending ? group(btn('chronicle',tr('Resolver decisión de campaña','Resolve story decision'),true)) : '')+
    '<ol class="mode-list chapter-list">'+chapters+'</ol>'+
    group(btn('campaign-endings',tr('Finales descubiertos','Discovered endings')+' · '+progress.endings.length+'/'+Object.keys(endings).length)+btn('home',tr('Volver','Back'))),true);
}

async function action(id,value) {
  sound.volume(profile.settings);
  sound.event('click');
  switch(id) {
    case 'home': game = null; show('home'); break;
    case 'start': await start(); break;
    case 'story-brief':
    case 'open-chapter':
      selected.mode='story';
      selected.stage=id==='open-chapter'?Number(value):nextChapter().id;
      selected.rival=false;
      if (!investigatorUnlocked(profile.progress,selected.character)) selected.character=0;
      loadoutOpen=false;
      show('brief');
      break;
    case 'open-mode':
      if (!Object.hasOwn(playModes,value) || value==='story') break;
      selected.mode=value;
      selected.rival=false;
      if (value!=='free') {
        if (!stageUnlocked(profile.progress,selected.stage)) selected.stage=nextChapter().id;
        if (!investigatorUnlocked(profile.progress,selected.character)) selected.character=0;
      }
      show('brief');
      break;
    case 'toggle-loadout':
      loadoutOpen=!loadoutOpen;
      show('brief');
      overlay.querySelector('[data-do="toggle-loadout"]')?.focus();
      break;
    case 'campaign-endings':
      codexFrom='campaign'; codexTab='finales'; show('codex'); break;
    case 'codex':
      codexFrom='journal'; codexTab='beasts'; show('codex'); break;
    case 'replace-yes':
      await start(true); break;
    case 'restore':
      await ready;
      try {
        const resumed=restore(JSON.parse(storage.getItem(suspendedKey)),Expedition);
        selected={...selected,...resumed.config};
        enter(resumed);
      } catch {
        try { storage.removeItem(suspendedKey); } catch {}
        show('home'); notice(tr('No se pudo reanudar la expedición.','The suspended run could not be restored.'));
      }
      break;
    case 'suspend':
      try {
        storage.setItem(suspendedKey,JSON.stringify(suspend(game)));
        game=null; show('home');
      } catch { notice(tr('No se pudo guardar la expedición.','The run could not be saved.')); }
      break;
    case 'extract':
      if (game?.playMode==='endless' && screen==='pause') { game.finish('retired'); syncScreen(); }
      break;
    case 'abandon-yes':
      try { storage.removeItem(suspendedKey); } catch {}
      game=null; show('home'); break;
    case 'pick-stage': selected.stage=Number(value); showSelection(id,value); break;
    case 'pick-character': selected.character=Number(value); showSelection(id,value); break;
    case 'pick-rival': selected.rival=value==='1'; showSelection(id,value); break;
    case 'pick-length': selected.length=Number(value); showSelection(id,value); break;
    case 'buy': if (buy(profile.progress,value)) persist(); show('archive'); break;
    case 'equip':
      if (!value || profile.progress.relics.includes(value)) { profile.progress.equipped=value; persist(); }
      show('archive'); break;
    case 'codex-tab': codexTab=value; show('codex'); break;
    case 'story-choice': {
      const result=resolveStory(profile.progress,value);
      if (!result) break;
      persist();
      if (result.ending) { ending=result.ending; show('ending'); }
      else { selected.stage=result.stage+1; selected.rival=false; selected.mode='story'; loadoutOpen=false; show('brief'); }
      break;
    }
    case 'resume': accumulator=0; pending={}; show('play'); break;
    case 'options':
      if (screen !== 'reset') optionsFrom = screen === 'pause' ? 'pause' : 'home';
      show('options'); break;
    case 'options-back': show(optionsFrom); break;
    case 'reset-controls':
      profile.settings.keys={...defaultKeys}; profile.settings.pad={...defaultPad}; persist(); show('options'); break;
    case 'choose': if (game.choose(value)) { pending={}; show('play'); } break;
    case 'ritual-yes':
    case 'ritual-no': game.resolveRitual(id === 'ritual-yes'); pending={}; show('play'); break;
    case 'interact':
      if (screen !== 'play') break;
      game.openRitual();
      if (game.mode === 'ritual') show('ritual');
      break;
    case 'fullscreen':
      try { if (document.fullscreenElement) await document.exitFullscreen(); else await app.requestFullscreen(); }
      catch { notice(tr('Pantalla completa no disponible.','Fullscreen unavailable.')); }
      break;
    case 'export': {
      const url = URL.createObjectURL(new Blob([JSON.stringify(profile,null,2)], {type:'application/json'}));
      const a = document.createElement('a'); a.href=url; a.download='ELDRITCH-404-perfil.json'; a.click();
      setTimeout(()=>URL.revokeObjectURL(url),3000); break;
    }
    case 'import': $('profile-file').click(); break;
    case 'reset-yes':
      try { storage.removeItem(key); storage.removeItem(key+'.backup'); storage.removeItem(suspendedKey); } catch { /* session can still be reset */ }
      profile=fresh(); persist(); show('options'); break;
    default: show(id);
  }

function navigate(controller) {
  if (screen === 'play') return;
  const items = Array.from(overlay.querySelectorAll('button:not(:disabled),select,input[data-setting]'));
  if (!items.length) return;
  const focused = document.activeElement;
  const current = items.indexOf(focused);
  if (controller.nav) {
    if (['left','right'].includes(controller.nav) && focused.dataset.setting && focused.type!=='checkbox') {
      const change = controller.nav === 'left' ? -1 : 1;
      if (focused.tagName === 'SELECT') focused.selectedIndex = clamp(focused.selectedIndex+change,0,focused.options.length-1);
      else if (focused.type === 'range') focused.value = clamp(Number(focused.value)+change*.05,Number(focused.min),Number(focused.max));
      focused.dispatchEvent(new Event('change',{bubbles:true}));
    } else {
      const index = ['left','up'].includes(controller.nav) ? -1 : 1;
      items[current < 0 ? 0 : (current+index+items.length)%items.length].focus();
    }
  }
  if (controller.confirm) {
    if (focused.tagName === 'SELECT') { try { focused.showPicker?.(); } catch { /* left/right changes the selection */ } }
    else (items[current] ?? items[0]).click();
  }
}

    else profile.settings[field] = e.target.type === 'checkbox' ? e.target.checked : e.target.type === 'range' ? Number(e.target.value) : e.target.value;
    sound.volume(profile.settings);
    persist();
    if (field === 'language') {
      if (game) makeHud();
      show('options');
      $(field)?.focus();
    }
    app.classList.toggle('large',profile.settings.large);
    app.classList.toggle('contrast',profile.settings.contrast);
  }
  if (e.target.id === 'profile-file' && e.target.files[0]) {
    try {
      const file = e.target.files[0];
      if (file.size > 64000) throw Error('File too large');
      profile = validate(JSON.parse(await file.text()));
      persist(); sound.volume(profile.settings);
      if (game) makeHud();
      show('options'); notice(tr('Perfil importado.','Profile imported.'));
    } catch { notice(tr('Archivo de perfil no válido.','Invalid profile file.')); }
    e.target.value='';
  }
});
document.addEventListener('visibilitychange',() => {
  if (document.hidden && screen === 'play') { input.releaseTouch(); show('pause'); }
});
window.addEventListener('blur',()=>{ if (screen==='play') show('pause'); });

let pending = {}, qaInput = {};
function frame(now) {
  const dt = previous === undefined ? 0 : Math.min(.09,(now-previous)/1000);
  if (previous !== undefined && screen === 'play') {
    samples.push(now-previous);
    if (samples.length > 360) samples.shift();
  }
  previous = now;
  const controller = input.poll(profile.settings.deadzone,now,profile.settings);
  qaInput = controller;
  if (controller.connected !== padConnected) {
    padConnected = controller.connected;
    if (!padConnected && screen==='play') show('pause');
    notice(padConnected ? tr('Mando conectado','Gamepad connected') : tr('Mando desconectado','Gamepad disconnected'));
  }
  const screenBeforeInput = screen;
  if ((controller.back || controller.start) && screen !== 'level') back();
  else if (screen === 'level' && game.choices[controller.choice]) action('choose',game.choices[controller.choice]);
  else navigate(controller);
  if (screen === 'play' && screenBeforeInput === 'play' && !testClock) {
    accumulator += dt;
    pending.dash ||= controller.dash;
    pending.interact ||= controller.interact;
    while (accumulator >= step && screen === 'play') {
      game.update(step,{x:controller.x,y:controller.y,...pending},camera);
      pending={}; accumulator -= step;
      syncScreen();
    }
  }
  if (game && !world.hidden) {
    if (screen === 'play' || screen !== drawnScreen) {
      camera = renderer.draw(game,profile.settings.reduced,profile.settings.contrast);
      updateHud();
    }
  }
  drawnScreen = screen;
  sound.score(screen === 'play' ? game.phase() : screen === 'result' && game.mode === 'won' ? 'victory' : 'low',game?.stage.id ?? 0);
  requestAnimationFrame(frame);
}
function syncScreen() {
  for (const event of game.events.splice(0)) {
    sound.event(event.type,event.value);
    if (event.type === 'boss') notice(loc(enemies[game.bossId].name));
    if (event.type === 'landmark' && !game.boss) {
      const cue = event.value===6 ? tr('Los proyectiles invierten su curso','Projectiles reverse course') :
        event.value===7 ? tr('Descarga desde los estantes','Volley from the shelves') :
        loc(game.stage.feature)+' · '+tr('Suelo inestable','Unstable ground');
      notice(cue);
    }
    if (event.type === 'boss-phase') notice(tr('Segunda fase','Second phase'));
    if (event.type === 'endless-clear') notice(tr('Jefes vencidos · ','Bosses defeated · ')+game.clearCount);
    if (event.type === 'evolution') notice(loc(weapons[event.value].name));
  }
  if (game.mode === 'level' || game.mode === 'ritual') show(game.mode);
  else if (['won','lost','retired'].includes(game.mode)) {
    try { storage.removeItem(suspendedKey); } catch {}
    record(profile,game); persist(); show('result');
  }
}
let drawnScreen = '';
const ready = renderer.load();
ready.catch(error => { console.error(error); notice(tr('Faltan recursos gráficos.','Art assets could not load.')); });
show('home');
requestAnimationFrame(frame);
if ('serviceWorker' in navigator && !testClock && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('./sw.js').then(reg => {
    reg.addEventListener('updatefound', () => {
      reg.installing?.addEventListener('statechange', event => {
        if (event.target.state === 'installed' && navigator.serviceWorker.controller) {
          notice(tr('Actualización lista. Cierra las pestañas del juego para activarla.','Update ready. Close the game tabs to activate it.'));
        }
      });
    });
  }).catch(error => console.warn('PWA:',error));
}
if (testClock) {
  window.qa = {
    snapshot: () => game && ({screen,mode:game.mode,hp:game.player.hp,x:game.player.x,y:game.player.y,
      time:game.time,kills:game.kills,level:game.level,boss:game.boss?.hp,arsenal:{...game.arsenal},choices:[...game.choices],stats:{...profile.stats}}),
    observe: () => game && structuredClone({ player:game.player, enemies:game.enemies, gems:{live:game.gems.live},
      hazards:{live:game.hazards.live}, boss:game.boss }),
    tick(frames, controls = null) {
      for (let i=0;i<frames && screen==='play';i++) {
        game.update(step,controls ?? {x:qaInput.x,y:qaInput.y,dash:qaInput.dash,interact:qaInput.interact},camera);
        syncScreen();
      }
      if (game) { camera=renderer.draw(game,profile.settings.reduced,profile.settings.contrast); updateHud(); }
    },
    measurements: () => [...samples]
  };
}

return {};
})();
</script>
</body>
</html>
